<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VERDANT Viewer (gen5)</title>
<style>
  :root {
    --bg: #0a0c0f;
    --panel: #121519;
    --panel-2: #1a1e24;
    --border: #252a32;
    --text: #c8ccd0;
    --text-dim: #6b7280;
    --accent: #7dd3a0;
    --accent-2: #ffb86c;
    --fail: #ff6b6b;
    --pass: #7dd3a0;
    --warn: #ffb86c;
    --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    height: 100%;
    overflow: hidden;
  }
  #app {
    display: grid;
    grid-template-columns: 280px 1fr 340px;
    grid-template-rows: 44px 1fr 36px;
    grid-template-areas:
      "header header header"
      "sidebar main inspector"
      "footer footer footer";
    height: 100vh;
  }
  header {
    grid-area: header;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
  }
  header .title {
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  header .meta { color: var(--text-dim); font-size: 11px; }
  header .spacer { flex: 1; }
  header button, header label.file-btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 10px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
  }
  header button:hover, header label.file-btn:hover {
    border-color: var(--accent);
  }
  header input[type=file] { display: none; }

  aside {
    background: var(--panel);
    padding: 12px;
    overflow-y: auto;
  }
  #sidebar {
    grid-area: sidebar;
    border-right: 1px solid var(--border);
  }
  #inspector {
    grid-area: inspector;
    border-left: 1px solid var(--border);
  }
  #main {
    grid-area: main;
    position: relative;
    overflow: hidden;
  }
  #grid-svg {
    width: 100%;
    height: 100%;
    background: #06080a;
    display: block;
  }

  footer {
    grid-area: footer;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 14px;
    color: var(--text-dim);
    font-size: 11px;
  }
  footer button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 3px 9px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
  }
  footer button:disabled { color: var(--text-dim); cursor: not-allowed; }
  footer input[type=range] {
    flex: 1;
    accent-color: var(--accent);
  }
  footer .tick-label {
    color: var(--text);
    min-width: 130px;
    font-variant-numeric: tabular-nums;
  }

  .panel {
    margin-bottom: 14px;
  }
  .panel h3 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .stat {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
  }
  .stat .k { color: var(--text-dim); }
  .stat .v {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .stat .v.warn { color: var(--accent-2); }

  .invariant {
    display: flex;
    justify-content: space-between;
    padding: 2px 4px;
    border-radius: 2px;
  }
  .invariant.pass .status { color: var(--pass); }
  .invariant.fail { background: rgba(255,107,107,0.1); }
  .invariant.fail .status { color: var(--fail); }
  .invariant.skipped .status { color: var(--text-dim); }

  .inspector-field {
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .inspector-field:last-child { border-bottom: none; }
  .inspector-field .k {
    color: var(--text-dim);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }
  .inspector-field .v {
    color: var(--text);
    word-break: break-all;
  }
  .phase-bar {
    display: flex;
    width: 100%;
    height: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .phase-bar > div { height: 100%; }
  .phase-solid  { background: hsl(30,  60%, 50%); }
  .phase-liquid { background: hsl(200, 70%, 50%); }
  .phase-gas    { background: hsl(50,  70%, 60%); }
  .phase-plasma { background: hsl(300, 60%, 55%); }
  .phase-vacuum { background: #2c3137; }

  .legend {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 10px;
    color: var(--text-dim);
  }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 1px solid var(--border);
  }

  /* Cell visualization */
  polygon.cell {
    stroke: rgba(0,0,0,0.5);
    stroke-width: 0.6;
    cursor: pointer;
  }
  polygon.cell:hover { stroke: var(--accent); stroke-width: 1.5; }
  polygon.cell.selected { stroke: var(--accent-2); stroke-width: 2; }

  /* Color view selector */
  .view-mode {
    display: flex;
    gap: 4px;
  }
  .view-mode button {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 6px;
    font-size: 10px;
    cursor: pointer;
    font-family: var(--mono);
  }
  .view-mode button.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 3px 6px;
    font-family: var(--mono);
    font-size: 11px;
    width: 100%;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">VERDANT</span>
    <span class="meta" id="run-meta">no run loaded</span>
    <span class="spacer"></span>
    <label class="file-btn">
      load tick(s)
      <input type="file" id="file-input" accept=".json" multiple>
    </label>
    <button id="reset-zoom">reset view</button>
  </header>

  <aside id="sidebar">
    <div class="panel">
      <h3>view mode</h3>
      <div class="view-mode" id="view-mode">
        <button data-mode="identity" class="active">identity</button>
        <button data-mode="temperature">temperature</button>
        <button data-mode="saturation">saturation</button>
        <button data-mode="pressure">pressure</button>
      </div>
    </div>

    <div class="panel">
      <h3>run</h3>
      <div id="run-panel" style="font-size:11px; line-height:1.5"></div>
    </div>

    <div class="panel">
      <h3>totals</h3>
      <div id="totals-panel"></div>
    </div>

    <div class="panel">
      <h3>invariants (self-report)</h3>
      <div id="invariants-panel"></div>
    </div>

    <div class="panel">
      <h3>legend</h3>
      <div class="legend" id="legend"></div>
    </div>
  </aside>

  <main id="main">
    <svg id="grid-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </main>

  <aside id="inspector">
    <div id="inspector-content" style="color:var(--text-dim); font-size:11px;">
      click a cell to inspect
    </div>
  </aside>

  <footer>
    <button id="tick-prev">&lt;</button>
    <span class="tick-label" id="tick-label">no ticks loaded</span>
    <button id="tick-next">&gt;</button>
    <input type="range" id="tick-slider" min="0" max="0" value="0">
    <button id="tick-play">play</button>
  </footer>
</div>

<script>
// ============================================================
// State
// ============================================================
let allTicks = [];        // [{ tick, stage, payload }]
let currentIdx = 0;
let currentData = null;
let selectedCellId = null;
let viewMode = 'identity';
let playing = false;
let playTimer = null;

// Pan/zoom for SVG
let panX = 0, panY = 0, zoom = 1;
let dragging = false, dragStartX = 0, dragStartY = 0, dragStartPanX = 0, dragStartPanY = 0;

// ============================================================
// File loading
// ============================================================
document.getElementById('file-input').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  allTicks = [];
  for (const f of files) {
    try {
      const text = await f.text();
      const payload = JSON.parse(text);
      allTicks.push({
        tick: payload.tick ?? 0,
        stage: payload.stage ?? 'unknown',
        payload,
        filename: f.name,
      });
    } catch (err) {
      console.error(`failed to parse ${f.name}:`, err);
    }
  }
  allTicks.sort((a, b) => a.tick - b.tick || a.stage.localeCompare(b.stage));
  if (allTicks.length === 0) return;
  currentIdx = 0;
  document.getElementById('tick-slider').max = allTicks.length - 1;
  document.getElementById('tick-slider').value = 0;
  loadTick(0);
});

function loadTick(idx) {
  if (idx < 0 || idx >= allTicks.length) return;
  currentIdx = idx;
  currentData = allTicks[idx].payload;
  document.getElementById('tick-slider').value = idx;
  document.getElementById('tick-label').textContent =
    `tick ${allTicks[idx].tick} (${allTicks[idx].stage})  [${idx+1}/${allTicks.length}]`;
  renderAll();
}

document.getElementById('tick-prev').addEventListener('click', () => loadTick(currentIdx - 1));
document.getElementById('tick-next').addEventListener('click', () => loadTick(currentIdx + 1));
document.getElementById('tick-slider').addEventListener('input', (e) => loadTick(parseInt(e.target.value)));
document.getElementById('tick-play').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('tick-play').textContent = playing ? 'pause' : 'play';
  if (playing) {
    playTimer = setInterval(() => {
      const next = (currentIdx + 1) % allTicks.length;
      loadTick(next);
    }, 250);
  } else {
    clearInterval(playTimer);
  }
});

// ============================================================
// View mode
// ============================================================
document.querySelectorAll('#view-mode button').forEach(btn => {
  btn.addEventListener('click', () => {
    viewMode = btn.dataset.mode;
    document.querySelectorAll('#view-mode button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
    renderLegend();
  });
});

// ============================================================
// Hex math
// ============================================================
function axialToPixel(q, r, size) {
  const x = size * Math.sqrt(3) * (q + r / 2);
  const y = size * 1.5 * r;
  return { x, y };
}
function hexPoints(cx, cy, size) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i - 30);
    pts.push(`${cx + size * Math.cos(angle)},${cy + size * Math.sin(angle)}`);
  }
  return pts.join(' ');
}

// ============================================================
// Color encoding
// ============================================================
// Identity-phase hue map
const PHASE_HUE = { solid: 30, liquid: 200, gas: 50, plasma: 300, void: 0 };

function cellColorIdentity(cell) {
  const phase = (cell.identity && cell.identity.phase) || 'void';
  if (phase === 'void') return '#2c3137';
  const h = PHASE_HUE[phase] ?? 0;
  // Saturation per cell EQ (computed approximately from phase_mass sum)
  const pm = cell.phase_mass || [0,0,0,0];
  const totalMass = pm.reduce((a,b) => a + b, 0);
  // Lightness scales loosely with how much mass the cell carries (full EQ for that
  // phase). Just clamp; precise EQ would need element/compound data we don't have here.
  // 0.5 → ~40% lightness, 1.0+ → 60% lightness.
  const lShift = Math.min(0.5, Math.log10(1 + totalMass) / 12);
  const l = 32 + lShift * 100 * 0.5;
  const s = phase === 'solid' ? 35 : 55;
  return `hsl(${h}, ${s}%, ${l}%)`;
}

function cellColorTemperature(cell) {
  const T = cell.temperature_K;
  if (T === undefined || T === null) return '#2c3137';
  // Cool→hot: blue (240) → red (0) through cyan/green/yellow
  // Map T range 0..1000 K (clip outside) to hue 240..0
  const tClamped = Math.max(0, Math.min(1000, T));
  const hue = 240 * (1 - tClamped / 1000);
  return `hsl(${hue}, 80%, 50%)`;
}

function cellColorSaturation(cell) {
  // Show per-phase saturation as identity-hued cell with lightness scaled by
  // sum(phase_mass). For at-equilibrium cells we don't know exact EQ without
  // compound props; approximate by total phase mass / a per-phase universal.
  const pm = cell.phase_mass || [0,0,0,0];
  const phase = (cell.identity && cell.identity.phase) || 'void';
  if (phase === 'void') return '#2c3137';
  const h = PHASE_HUE[phase] ?? 0;
  const totalMass = pm.reduce((a,b) => a + b, 0);
  // Use log scale to handle the 0 to ~100k range gracefully
  const norm = Math.min(1, Math.log10(1 + totalMass) / 5);
  const l = 15 + norm * 50;
  return `hsl(${h}, 70%, ${l}%)`;
}

function cellColorPressure(cell) {
  const p = cell.pressure_raw;
  if (p === undefined || p === 0) return '#2c3137';
  // Pressure is unsigned u16 deviation (current stub). Higher → redder.
  const norm = Math.min(1, p / 10000);
  const hue = 240 * (1 - norm);
  return `hsl(${hue}, 70%, 45%)`;
}

function cellColor(cell) {
  switch (viewMode) {
    case 'temperature': return cellColorTemperature(cell);
    case 'saturation':  return cellColorSaturation(cell);
    case 'pressure':    return cellColorPressure(cell);
    case 'identity':
    default:            return cellColorIdentity(cell);
  }
}

// ============================================================
// Rendering
// ============================================================
function renderGrid() {
  const svg = document.getElementById('grid-svg');
  svg.innerHTML = '';
  if (!currentData) return;
  const cells = currentData.cells || [];
  if (!cells.length) return;
  const size = 28;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  cells.forEach(c => {
    const { x, y } = axialToPixel(c.coord[0], c.coord[1], size);
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  });
  const pad = size * 2;
  const vbW = maxX - minX + pad * 2;
  const vbH = maxY - minY + pad * 2;
  svg.setAttribute('viewBox', `${minX - pad - panX} ${minY - pad - panY} ${vbW / zoom} ${vbH / zoom}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  // Background grid layer
  cells.forEach(c => {
    const { x, y } = axialToPixel(c.coord[0], c.coord[1], size);
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', hexPoints(x, y, size));
    poly.setAttribute('fill', cellColor(c));
    const cls = ['cell'];
    if (c.id === selectedCellId) cls.push('selected');
    poly.setAttribute('class', cls.join(' '));
    poly.addEventListener('click', () => {
      selectedCellId = c.id;
      renderGrid();
      renderInspector();
    });
    svg.appendChild(poly);

    // Optional label: identity element symbol or T
    if (size > 18) {
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', x);
      txt.setAttribute('y', y + 4);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('fill', 'rgba(255,255,255,0.55)');
      txt.setAttribute('font-size', '8');
      txt.setAttribute('font-family', 'monospace');
      txt.setAttribute('pointer-events', 'none');
      let label = '';
      if (viewMode === 'temperature' && c.temperature_K !== undefined) {
        label = `${c.temperature_K.toFixed(0)}K`;
      } else if (viewMode === 'identity') {
        label = (c.identity && c.identity.element) || '';
      } else if (viewMode === 'pressure') {
        label = c.pressure_raw > 0 ? `${c.pressure_raw}` : '';
      }
      txt.textContent = label;
      svg.appendChild(txt);
    }

    // Petal velocity vectors (faint arrows for cells with non-trivial v)
    if (viewMode === 'identity' && c.petals) {
      c.petals.forEach((p, dirIdx) => {
        const [vx, vy] = p.velocity || [0, 0];
        const mag = Math.sqrt(vx * vx + vy * vy);
        if (mag < 1e-3) return;
        const len = Math.min(size * 0.6, mag * 5);
        // Petal direction in pointy-top hex axial: 6 unit vectors
        const dirAngles = [60, 120, 180, 240, 300, 0]; // pointy-top
        const angRad = Math.PI / 180 * dirAngles[dirIdx];
        const dx = Math.cos(angRad) * len;
        const dy = Math.sin(angRad) * len;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x); line.setAttribute('y1', y);
        line.setAttribute('x2', x + dx); line.setAttribute('y2', y + dy);
        line.setAttribute('stroke', 'rgba(255,255,255,0.4)');
        line.setAttribute('stroke-width', '0.7');
        line.setAttribute('pointer-events', 'none');
        svg.appendChild(line);
      });
    }
  });
}

function renderInspector() {
  const el = document.getElementById('inspector-content');
  if (selectedCellId === null || !currentData) {
    el.innerHTML = '<p style="color:var(--text-dim); font-size:11px;">click a cell to inspect</p>';
    return;
  }
  const cell = currentData.cells.find(c => c.id === selectedCellId);
  if (!cell) return;
  const field = (k, v) => `
    <div class="inspector-field">
      <div class="k">${k}</div>
      <div class="v">${v}</div>
    </div>`;

  // Phase bar
  const pf = cell.phase_fraction || [0,0,0,0];
  const vac = Math.max(0, 1 - pf.reduce((a,b) => a + b, 0));
  const phaseBar = `
    <div class="phase-bar">
      <div class="phase-solid"  style="width:${(pf[0]*100).toFixed(1)}%"></div>
      <div class="phase-liquid" style="width:${(pf[1]*100).toFixed(1)}%"></div>
      <div class="phase-gas"    style="width:${(pf[2]*100).toFixed(1)}%"></div>
      <div class="phase-plasma" style="width:${(pf[3]*100).toFixed(1)}%"></div>
      <div class="phase-vacuum" style="width:${(vac*100).toFixed(1)}%"></div>
    </div>
    <div style="font-size:10px; color:var(--text-dim)">
      s ${pf[0].toFixed(3)} / l ${pf[1].toFixed(3)} / g ${pf[2].toFixed(3)} / p ${pf[3].toFixed(3)} / vac ${vac.toFixed(3)}
    </div>`;

  // Phase mass
  const pm = cell.phase_mass || [0,0,0,0];
  const pmStr = `
    <div style="font-variant-numeric:tabular-nums">
      s: ${pm[0].toFixed(3)}<br>
      l: ${pm[1].toFixed(3)}<br>
      g: ${pm[2].toFixed(3)}<br>
      p: ${pm[3].toFixed(3)}<br>
      <span style="color:var(--text-dim)">Σ = ${pm.reduce((a,b)=>a+b,0).toFixed(3)}</span>
    </div>`;

  // Composition
  const comp = (cell.composition || [])
    .map(([e, f]) => `${e}: ${f}/255 (${(f/255*100).toFixed(1)}%)`)
    .join('<br>') || '—';

  // Flags
  const flags = Object.entries(cell.flags || {})
    .filter(([k, v]) => v)
    .map(([k]) => k)
    .join(', ') || '—';

  el.innerHTML =
    field('ID', cell.id) +
    field('COORD (q, r)', cell.coord.join(', ')) +
    field('IDENTITY', `${(cell.identity && cell.identity.phase) || '—'} · ${(cell.identity && cell.identity.element) || '—'}`) +
    field('PHASE FRACTION', phaseBar) +
    field('PHASE MASS (hex)', pmStr) +
    field('TEMPERATURE', cell.temperature_K !== undefined ? `${cell.temperature_K.toFixed(2)} K` : '—') +
    field('ENERGY (raw, log10(1+J)·M)', cell.energy_raw ?? '—') +
    field('PRESSURE (raw, dev)', cell.pressure_raw ?? '—') +
    field('MOHS', cell.mohs_level ?? '—') +
    field('COMPOSITION', comp) +
    field('FLAGS', flags) +
    field('SUSTAINED OVERPRESSURE', cell.sustained_overpressure !== undefined ? cell.sustained_overpressure.toFixed(4) : '—');
}

function renderSidebar() {
  if (!currentData) return;

  // Run meta
  const runEl = document.getElementById('run-panel');
  runEl.innerHTML = `
    <div><strong>scenario:</strong> ${currentData.scenario || '—'}</div>
    <div><strong>tick:</strong> ${currentData.tick ?? '—'}</div>
    <div><strong>stage:</strong> ${currentData.stage || '—'}</div>
    <div><strong>cycle:</strong> ${currentData.cycle ?? '—'}</div>
    <div><strong>elements:</strong> ${(currentData.allowed_elements || []).join(', ') || '—'}</div>
    <div style="color:var(--text-dim); margin-top:4px; font-size:10px; word-break:break-all">
      ${currentData.element_table_hash || '—'}
    </div>`;

  // Totals
  const t = currentData.totals || {};
  const totalsEl = document.getElementById('totals-panel');
  let html = '';
  if (t.mass_by_element_by_phase) {
    Object.entries(t.mass_by_element_by_phase).forEach(([el, byPhase]) => {
      const total = Object.values(byPhase).reduce((a,b) => a + b, 0);
      html += `<div class="stat"><span class="k">${el}</span><span class="v">${total.toFixed(2)}</span></div>`;
    });
  }
  if (t.energy_total !== undefined) {
    html += `<div class="stat"><span class="k">energy_J</span><span class="v">${t.energy_total.toFixed(2)}</span></div>`;
  }
  if (t.cells_by_dominant_phase) {
    Object.entries(t.cells_by_dominant_phase).forEach(([k, v]) => {
      if (v > 0) html += `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`;
    });
  }
  ['cells_culled', 'cells_fractured', 'cells_ratcheted_this_tick', 'cells_excluded'].forEach(k => {
    if (t[k]) html += `<div class="stat"><span class="k">${k}</span><span class="v warn">${t[k]}</span></div>`;
  });
  totalsEl.innerHTML = html;

  // Invariants
  const invEl = document.getElementById('invariants-panel');
  invEl.innerHTML = (currentData.invariants || []).map(inv => `
    <div class="invariant ${inv.status}">
      <span>${inv.name}</span>
      <span class="status">${inv.status.toUpperCase()}</span>
    </div>
  `).join('');

  // Run-meta header
  const tickInfo = currentData.scenario
    ? `${currentData.scenario} · tick ${currentData.tick} · ${currentData.cells.length} cells`
    : 'no run loaded';
  document.getElementById('run-meta').textContent = tickInfo;
}

function renderLegend() {
  const el = document.getElementById('legend');
  let html = '';
  if (viewMode === 'identity' || viewMode === 'saturation') {
    Object.entries(PHASE_HUE).forEach(([k, h]) => {
      if (k === 'void') {
        html += `<span><i style="background:#2c3137"></i>${k}</span>`;
      } else {
        const s = k === 'solid' ? 35 : 55;
        html += `<span><i style="background:hsl(${h}, ${s}%, 50%)"></i>${k}</span>`;
      }
    });
  } else if (viewMode === 'temperature') {
    [0, 250, 500, 750, 1000].forEach(T => {
      const hue = 240 * (1 - T / 1000);
      html += `<span><i style="background:hsl(${hue}, 80%, 50%)"></i>${T} K</span>`;
    });
  } else if (viewMode === 'pressure') {
    [0, 2500, 5000, 7500, 10000].forEach(p => {
      const hue = 240 * (1 - Math.min(1, p / 10000));
      html += `<span><i style="background:hsl(${hue}, 70%, 45%)"></i>${p}</span>`;
    });
  }
  el.innerHTML = html;
}

function renderAll() {
  renderGrid();
  renderInspector();
  renderSidebar();
  renderLegend();
}

// ============================================================
// Pan + zoom (drag SVG, scroll to zoom)
// ============================================================
const svg = document.getElementById('grid-svg');
svg.addEventListener('mousedown', (e) => {
  dragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  dragStartPanX = panX; dragStartPanY = panY;
  svg.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  panX = dragStartPanX + (e.clientX - dragStartX);
  panY = dragStartPanY + (e.clientY - dragStartY);
  renderGrid();
});
window.addEventListener('mouseup', () => {
  dragging = false;
  svg.style.cursor = 'grab';
});
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoom *= e.deltaY < 0 ? 1.1 : 0.9;
  zoom = Math.max(0.1, Math.min(10, zoom));
  renderGrid();
}, { passive: false });

document.getElementById('reset-zoom').addEventListener('click', () => {
  panX = 0; panY = 0; zoom = 1;
  renderGrid();
});

// ============================================================
// Boot
// ============================================================
renderLegend();
</script>
</body>
</html>
